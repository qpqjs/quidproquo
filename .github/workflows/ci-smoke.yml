name: ci-smoke

# Reusable: scaffolds an app with create-qpq-app and checks it still builds.
#
# Called by smoke.yml on branches, and by deploy-site.yml as a gate before it
# deploys. Both paths run this one definition.
on:
  workflow_call:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build the whole monorepo: the scaffold's file: refs pull built lib/
      # outputs, and create-qpq-app's bin has to exist before the smoke runs.
      - run: npm run build
      - run: npm run smoke

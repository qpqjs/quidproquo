name: smoke

# The create-qpq-app scaffold check, run on every push independently of
# deploy-site: it must not hold up deploying a branch. Its job is to block
# merging to main (branch protection, to come), not to gate environments.
on:
  push:
    branches-ignore: [dependabot/**]
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    uses: ./.github/workflows/ci-smoke.yml

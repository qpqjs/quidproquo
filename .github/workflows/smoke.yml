name: smoke

# main and develop are deliberately excluded: deploy-site runs the same
# reusable workflow as a gate before it deploys those branches.
on:
  push:
    branches-ignore: [main, develop]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    uses: ./.github/workflows/ci-smoke.yml

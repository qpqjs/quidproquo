name: release

# Publish every workspace package to npm and make the GitHub release. Run it by
# hand on main from the Actions tab ("Run workflow"), or with
#   gh workflow run release.yml -f level=minor
# Pick the level: patch for fixes and features, minor for anything breaking
# (0.1.x to 0.2.0), major for 1.0. A patch is refused while breaking-changes.md
# has bullets under ## vNext.
#
# Three jobs, so the npm publish rights never share a job with third-party code:
#   build   - bumps, writes the changelog with Claude, commits and tags locally,
#             then builds, tests, scaffolds and packs. Cannot publish.
#   publish - can mint an npm token (trusted publishing, no stored secret) and
#             installs nothing. Pushes the bump commit and tag, publishes the
#             tarballs, then makes the GitHub release.
#   deploy  - the ordinary site deploy (ci-deploy-site.yml) to production, on
#             the tag just pushed and pinned to the packages just published,
#             smoke included. The one deploy that proves what npm serves
#             installs, builds and runs. No npm rights. A failure here cannot
#             undo the release: the run going red is the signal, and the fix is
#             a patch release, or a manual deploy-site run from main with
#             from_npm if the packages were not at fault.
#
# The publish job runs in the `npm` environment, which waits for a maintainer to
# approve the run ("Review deployments" on the run page) and only accepts main.
# npm's trusted publisher for every package names that environment, so a changed
# copy of this workflow on another branch cannot publish.
#
# The push comes before the publish so the bump commit and tag are on origin
# whatever happens to npm. If publish fails, use "Re-run failed jobs": pushing
# the same commit again is a no-op and the publish skips versions already on
# npm. A package that needs a fix before it can publish is published by hand
# from the tag (check it out, npm ci, npm run build, npm publish -w <package>);
# the next release bumps past the version either way, and a gap in the
# published versions is harmless.
on:
  workflow_dispatch:
    inputs:
      level:
        description: Version part to bump
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

# One release at a time, and never cancel one partway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Releases come from main only. LTS-* branches still release by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.bump.outputs.version }}
    env:
      LEVEL: ${{ inputs.level }}
    steps:
      # Full history and tags: /changes reads back to the last release tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: check the level against breaking-changes.md
        run: npx tsx ./scripts/releaseCheckLevel.ts "$LEVEL"

      - name: bump every package
        id: bump
        run: |
          npm version "$LEVEL" --ws --no-workspaces-update
          npx tsx ./scripts/applyPatch.ts
          npm install
          # The site has its own lockfile over file: links to the packages, so it is
          # resolved locally here and never waits on the registry.
          npm install --package-lock-only --ignore-scripts --prefix quidproquojs.com
          version=$(node -p "require('./packages/core/package.json').version")
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::$version is already tagged"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: write the changelog
        timeout-minutes: 20
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          npm run changelog

      - name: extract the release notes
        run: npx tsx ./scripts/releaseNotes.ts "$VERSION" "$RUNNER_TEMP/release/notes.md"

      # The bundle carries the commit and tag to the publish job, which pushes
      # them only once the packages are on npm.
      - name: commit and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m "bump: $VERSION"
          git tag "$VERSION"
          git bundle create "$RUNNER_TEMP/release/release.bundle" "refs/tags/$VERSION" "^$GITHUB_SHA"

      - run: npm run build
      - run: npm test
      - run: npm run scaffold

      - name: pack
        run: npx tsx ./scripts/releasePack.ts "$RUNNER_TEMP/release/packages"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      # Push the bump commit and tag, and make the release.
      contents: write
      # Exchanged for a short-lived npm publish token (trusted publishing).
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      # Trusted publishing needs npm 11.5.1 or later; the node in .nvmrc ships with it.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: load the bump commit
        run: git fetch "$RUNNER_TEMP/release/release.bundle" "refs/tags/${VERSION}:refs/tags/${VERSION}"

      # The bump commit's parent is the commit this run started from, so if main
      # has moved on it cannot be pushed. Stop before anything reaches npm.
      - name: check main has not moved
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          bump=$(git rev-parse "$VERSION^{commit}")
          if [ "$main" != "$GITHUB_SHA" ] && [ "$main" != "$bump" ]; then
            echo "::error::main moved to $main after this release started from $GITHUB_SHA"
            exit 1
          fi

      # Pushed with the workflow token, which does not start other workflows, so
      # the bump commit does not set off deploy-site. Before the publish, so the
      # commit and tag exist on origin even if npm refuses a package.
      - name: push the bump commit and tag
        run: git push --atomic origin "$(git rev-parse "$VERSION^{commit}"):refs/heads/main" "refs/tags/$VERSION"

      - name: publish to npm
        run: node ./scripts/releasePublish.mts "$RUNNER_TEMP/release/packages"

      - name: make the github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/release/notes.md" --verify-tag
          fi

  # Runs once the packages are on npm and the tag is pushed, so the tag
  # checkout works and the registry wait has something to wait for. The tag
  # and main are the same bump commit at that moment; the tag is used because
  # main can move while the deploy runs. The reusable workflow's own
  # `environment: production` supplies the role and region, and its per
  # environment concurrency lock queues this behind any manual production
  # deploy rather than racing it.
  deploy:
    needs: [build, publish]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-deploy-site.yml
    with:
      environment: production
      from_npm: true
      ref: refs/tags/${{ needs.build.outputs.version }}

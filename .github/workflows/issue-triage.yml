name: Issue Triage

# Five jobs, the Claude ones driven by prompts in .github/prompts/:
#   triage  - a new issue (or one a maintainer labels `triage`) gets assessed,
#             labelled, and if it is real, a branch issue-{n} with a plan file.
#   respond - every human comment on an issue gets read against the full thread
#             and the plan; Claude answers if there is something to answer and
#             updates the plan on the branch if the comment changes it.
#   work    - a maintainer applies `start-work`; Claude implements the plan on
#             the issue-{n} branch, runs the checks, and opens a PR.
#   review  - a human comments on or reviews a PR the bot opened; Claude makes
#             the requested changes on the branch and replies in the threads.
#   merged  - a bot PR merges; plain shell closes out the issue, fixes labels,
#             and deletes the branch. No Claude involved.
#
# The issue jobs share a concurrency group per issue so overlapping runs queue
# rather than race on the branch. Every job has a timeout-minutes: a hung
# command inside a Claude run would otherwise sit for the six-hour default.

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]

jobs:
  triage:
    if: |
      github.event_name == 'issues' &&
      (github.event.action == 'opened' || github.event.label.name == 'triage')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The official Claude app token cannot write under .github/workflows
      # (no `workflows` scope), so GitHub API and git pushes use a token from
      # our own app, which has Contents, Issues, Pull requests and Workflows
      # read/write. Claude auth still comes from CLAUDE_CODE_OAUTH_TOKEN.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TRIAGE_APP_ID }}
          private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}

      - name: Ensure triage labels exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/prompts/ensure-labels.sh

      # Step one: decide what the issue is and label it. Opus is enough for
      # the verdict. The prompt writes the verdict to .triage-verdict so the
      # workflow can decide whether the planning step runs at all.
      - name: Triage issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # The issue number is numeric so interpolating it is injection-safe.
          # Everything user-written (title, body) is fetched by Claude via gh,
          # never interpolated into the prompt.
          prompt: |
            Issue number: ${{ github.event.issue.number }}
            Repository: ${{ github.repository }}
            Read .github/prompts/issue-triage.md and follow it exactly.
          claude_args: >-
            --model claude-opus-5
            --allowed-tools "Read,Glob,Grep,Write,Bash(git:*),Bash(gh issue:*),Bash(gh api:*)"

      - name: Read verdict
        id: verdict
        run: echo "verdict=$(cat .triage-verdict 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      # Step two: write the plan. Only for real bugs and enhancements, and on
      # Fable, since the plan is what the work job later implements.
      - name: Write plan
        if: steps.verdict.outputs.verdict == 'bug' || steps.verdict.outputs.verdict == 'enhancement'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            Issue number: ${{ github.event.issue.number }}
            Repository: ${{ github.repository }}
            Verdict from triage: ${{ steps.verdict.outputs.verdict }}
            Read .github/prompts/issue-plan.md and follow it exactly.
          claude_args: >-
            --model claude-fable-5-1
            --allowed-tools "Read,Glob,Grep,Write,Edit,Bash(git:*),Bash(gh issue:*),Bash(gh api:*)"

  respond:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The official Claude app token cannot write under .github/workflows
      # (no `workflows` scope), so GitHub API and git pushes use a token from
      # our own app, which has Contents, Issues, Pull requests and Workflows
      # read/write. Claude auth still comes from CLAUDE_CODE_OAUTH_TOKEN.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TRIAGE_APP_ID }}
          private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}

      - name: Respond to comment
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            Issue number: ${{ github.event.issue.number }}
            Trigger comment id: ${{ github.event.comment.id }}
            Repository: ${{ github.repository }}
            Read .github/prompts/issue-comment.md and follow it exactly.
          claude_args: >-
            --model claude-fable-5-1
            --allowed-tools "Read,Glob,Grep,Write,Edit,Bash(git:*),Bash(gh issue:*),Bash(gh api:*)"

  work:
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'start-work'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The official Claude app token cannot write under .github/workflows
      # (no `workflows` scope), so GitHub API and git pushes use a token from
      # our own app, which has Contents, Issues, Pull requests and Workflows
      # read/write. Claude auth still comes from CLAUDE_CODE_OAUTH_TOKEN.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TRIAGE_APP_ID }}
          private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}

      # No install or build here: they take minutes and most runs never need
      # them. The prompt has Claude install and build on demand when it wants
      # to run tests, and say so on the issue first.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Ensure triage labels exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/prompts/ensure-labels.sh

      - name: Implement the plan
        # Commits are authored by the person who triggered the run and only
        # committed by the bot, so history shows who asked for the work. The
        # noreply address links the commit to their GitHub account.
        env:
          GIT_AUTHOR_NAME: ${{ github.event.sender.login }}
          GIT_AUTHOR_EMAIL: ${{ github.event.sender.id }}+${{ github.event.sender.login }}@users.noreply.github.com
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            Issue number: ${{ github.event.issue.number }}
            Repository: ${{ github.repository }}
            Read .github/prompts/issue-work.md and follow it exactly.
          claude_args: >-
            --model claude-fable-5-1
            --allowed-tools "Read,Glob,Grep,Write,Edit,Bash(git:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh api:*),Bash(npm:*),Bash(npx:*)"

      # The prompt tells Claude to always comment and relabel before it
      # finishes, but if the action itself dies (timeout, crash, token
      # trouble) nothing runs that code. Put the issue back to `planned` and
      # say why, so a maintainer can re-apply `start-work` after fixing it.
      - name: Unstick the issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label in-progress --add-label planned
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "The work run failed before it could finish: $RUN_URL. Labels are back to \`planned\`; re-apply \`start-work\` once the cause is fixed."

  review:
    # Only PRs the bot opened, only human feedback, and only reviews that
    # actually say something (a bare approve has nothing to act on).
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.user.login == 'qpq-triage[bot]' &&
        github.event.comment.user.type != 'Bot'
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.user.login == 'qpq-triage[bot]' &&
        github.event.comment.user.type != 'Bot'
      ) || (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.user.login == 'qpq-triage[bot]' &&
        github.event.review.user.type != 'Bot' &&
        github.event.review.body != ''
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TRIAGE_APP_ID }}
          private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}

      # No install or build here: they take minutes and most runs never need
      # them. The prompt has Claude install and build on demand when it wants
      # to run tests, and say so on the issue first.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply review feedback
        # Commits are authored by the person who triggered the run and only
        # committed by the bot, so history shows who asked for the work. The
        # noreply address links the commit to their GitHub account.
        env:
          GIT_AUTHOR_NAME: ${{ github.event.sender.login }}
          GIT_AUTHOR_EMAIL: ${{ github.event.sender.id }}+${{ github.event.sender.login }}@users.noreply.github.com
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            PR number: ${{ github.event.pull_request.number || github.event.issue.number }}
            Trigger event: ${{ github.event_name }}
            Trigger id: ${{ github.event.comment.id || github.event.review.id }}
            Repository: ${{ github.repository }}
            Read .github/prompts/pr-review.md and follow it exactly.
          claude_args: >-
            --model claude-fable-5-1
            --allowed-tools "Read,Glob,Grep,Write,Edit,Bash(git:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh api:*),Bash(npm:*),Bash(npx:*)"

      - name: Report failure on the PR
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "The review run failed before it could respond: $RUN_URL. Comment again once the cause is fixed."

  merged:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'qpq-triage[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TRIAGE_APP_ID }}
          private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}

      # The issue number is the branch suffix, so no parsing of the PR body.
      - name: Close out the issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          issue="${HEAD_REF#issue-}"
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
            --body "Merged in #$PR by @$MERGED_BY. Branch \`$HEAD_REF\` deleted."
          gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" \
            --remove-label in-review --remove-label in-progress --remove-label planned \
            --add-label done
          gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" || true

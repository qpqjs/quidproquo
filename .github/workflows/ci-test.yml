name: ci-test

# Reusable: the monorepo unit suite across supported node versions.
#
# Called by test.yml on pull requests (every version), and by deploy-site.yml on
# every push, which gates the deploy on the version it deploys with and runs the
# rest alongside. Both paths run this one definition, so a deploy is guarded by
# the same suite that runs on a pull request.
on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON list of node major versions to run the suite on
        type: string
        default: '[24, 25, 26]'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Lint needs no build and fails fast.
      - run: npm run lint
      # Cross-package imports resolve to each package's built lib/, so the
      # suite needs the monorepo built before vitest can load the test files.
      - run: npm run build
      - run: npm test

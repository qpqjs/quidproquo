name: ci-test

# Reusable: the monorepo unit suite across supported node versions.
#
# Called by test.yml on pull requests (every version), by ci-deploy-site.yml as
# a deploy gate on the version it deploys with, and by deploy-site.yml for the
# rest alongside. Every path runs this one definition, so a deploy is guarded by
# the same suite that runs on a pull request.
#
# Every version runs the suite as three shards on three runners. The suite is
# import-bound (1400 files each loading the framework from source) and a
# standard runner has four cores, so one runner takes five minutes where three
# take under two. vitest splits the file list evenly across the shards.
#
# Only the lint, dependency and type checks need the whole monorepo built; they
# run once in ci-check.yml. The tests resolve every @qpqjs/* import to source
# (the vitest configs alias them), so a shard builds just what the configs
# themselves load from lib/: @qpqjs/testing and its one dependency, core.
on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON list of node major versions to run the suite on
        type: string
        default: '[24, 25, 26]'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
        shard: [1, 2, 3]
    name: node ${{ matrix.node }} shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # In dependency order: testing's build type-checks against core's lib/.
      - run: npm run build -w @qpqjs/core -w @qpqjs/testing
      # The shard count here and in the matrix above must agree.
      - run: npm test -- --shard=${{ matrix.shard }}/3

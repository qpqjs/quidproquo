name: deploy-site

# Deploy quidproquojs.com.
#   push to main    -> production
#   push to uat     -> staging
#   push elsewhere  -> development (every feature branch, serialized, last writer wins)
# Any environment can also be deployed by hand from the Actions tab
# ("Run workflow"), the way to redeploy an environment out of band.
on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        default: production
        options: [development, staging, production]

# Default for every job, including the reusable test/scaffold workflows called below.
# Only the deploy job widens this to mint an OIDC token.
permissions:
  contents: read

jobs:
  # Deploy gate: the unit tests.
  test:
    uses: ./.github/workflows/ci-test.yml

  # The create-qpq-app scaffold check (template rot guard). Runs alongside the
  # tests so every push gets one workflow run, but it is deliberately NOT in
  # deploy's `needs`: it must never hold up deploying a branch. Its job is to
  # block merging to main (branch protection, to come). Not to be confused
  # with the "deployed smoke" step at the end of the deploy job.
  scaffold:
    uses: ./.github/workflows/ci-scaffold.yml

  # Deploy gate: the same probes the deployed smoke runs, but against a dev
  # server on the runner. Runs alongside the tests rather than after them,
  # since it shares nothing with them but the build, and it finishes first.
  #
  # A gate rather than advisory (unlike scaffold above) because a probe that
  # cannot pass locally has no business being deployed and then run again
  # against AWS: the deployed smoke would just find the same break, minutes
  # later and after a real deploy.
  #
  # The permissions block is required here, not just in the called workflow: a
  # reusable workflow can only narrow what its caller grants, and the
  # repository default above is contents-read only.
  local-smoke:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-local-smoke.yml

  # The target environment is resolved once, in its own job, because neither
  # `environment:` nor job-level `concurrency:` can read step outputs, so each
  # would otherwise need its own copy of the branch mapping. Three copies that
  # can drift is how a deploy ends up running against production while holding
  # the development concurrency lock.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
    steps:
      - id: pick
        run: |
          echo "env=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.env || (github.ref_name == 'main' && 'production' || (github.ref_name == 'uat' && 'staging' || 'development')) }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [resolve, test, local-smoke]
    runs-on: ubuntu-latest
    # Required for GitHub OIDC -> AWS role assumption. No long-lived keys stored.
    permissions:
      id-token: write
      contents: read
    # The GitHub Environment supplies the per-account role ARN + region, and is
    # where required reviewers go to gate production behind a manual approval.
    environment: ${{ needs.resolve.outputs.env }}
    # Serialize deploys per environment so rapid pushes queue instead of racing.
    # Never cancel a running deploy: a half-applied CloudFormation stack is
    # worse than waiting.
    concurrency:
      group: deploy-site-${{ needs.resolve.outputs.env }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: quidproquojs.com/.nvmrc

      # Build the monorepo first: quidproquojs.com pulls the quidproquo-*
      # packages via file: refs, which resolve to each package's built lib/.
      - run: npm ci
      - run: npm run build

      # Install the site (links the file: deps) and build the docs site: the
      # web stack uploads docusaurus/build, and qpq does not build it for us.
      - run: npm ci
        working-directory: quidproquojs.com
      - run: npm run build --workspace docusaurus
        working-directory: quidproquojs.com

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          # Set per GitHub Environment (Settings -> Environments -> <env> ->
          # Variables), so each account/region supplies its own role + region.
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Fully non-interactive deploy: all services, all stacks (inf -> api ->
      # web -> views), in parallel via docker. The AWS_* creds set by the step
      # above are passed through to the deploy containers.
      - run: npx qpq go:docker all all --app qpqjs --env ${{ needs.resolve.outputs.env }}
        working-directory: quidproquojs.com

      # Verify the deployment end to end: mint a GitHub OIDC token with the
      # qpq-smoke audience, start a smoke run on the deployed test service,
      # poll it to completion. The smoke endpoint validates the token against
      # this repo's immutable id and this job's `environment:` claim, so only
      # this workflow can call it. Non-production only: prod has no CI smoke
      # path.
      #
      # Deliberately a step of THIS job, not a job of its own: the per
      # environment concurrency lock above is held until the job ends, so a
      # queued deploy for the next push cannot start until this one has both
      # deployed and been verified. As a separate job the smoke would run
      # against an environment the next deploy was already replacing.
      - name: deployed smoke
        if: needs.resolve.outputs.env != 'production'
        run: node scripts/deployedSmoke.mjs
        working-directory: quidproquojs.com
        env:
          SMOKE_ENVIRONMENT: ${{ needs.resolve.outputs.env }}

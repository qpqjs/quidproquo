name: deploy-site

# Deploy quidproquojs.com on push. This file only maps a push to an
# environment; the deploy itself (gates, build, deploy, smoke) is the reusable
# ci-deploy-site.yml, so a branch push, a manual run and any later caller all
# deploy the same way.
#   push to main    -> staging
#   push elsewhere  -> development (every feature branch, serialized, last writer wins)
# Production is not on any branch yet: deploy it by hand from the Actions tab
# ("Run workflow"), which is also the way to redeploy any environment out of
# band.
#
# Pushes made by a bot (claude[bot], github-actions[bot], ...) run the
# advisory checks (tests, scaffold, lint) but never build for or deploy to
# AWS: the issue automation pushes plan edits and WIP commits to issue-{n}
# branches, and none of that should hit AWS. See the resolve job.
on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        default: production
        options: [development, staging, production]

# Default for every job, including the reusable workflows called below. Only
# the deploy job widens this, so ci-deploy-site.yml can mint an OIDC token.
permissions:
  contents: read

jobs:
  # The target environment, and whether this run touches AWS at all, are
  # resolved once, in their own job, so the branch mapping exists in exactly
  # one place: `uses:` cannot read step outputs, so without this job the
  # mapping would be copied wherever it is needed, and copies that drift are
  # how a deploy ends up in the wrong environment.
  #
  # `deploy` is false for bot-authored pushes (any actor ending in `[bot]`):
  # the issue automation pushes plan edits and WIP commits to issue-{n}
  # branches, and a development deploy for each of those is pure waste. Same
  # "skip bots" intent as the `!dependabot/**` exclusion on the push trigger.
  # A manual "Run workflow" is not affected, since the actor there is whoever
  # clicked the button. Deploying bot-authored work on purpose (a deploy
  # label, an approved PR) is a later change.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
      deploy: ${{ steps.pick.outputs.deploy }}
    steps:
      - id: pick
        run: |
          echo "env=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.env || (github.ref_name == 'main' && 'staging' || 'development') }}" >> "$GITHUB_OUTPUT"
          echo "deploy=${{ github.event_name == 'workflow_dispatch' || !endsWith(github.actor, '[bot]') }}" >> "$GITHUB_OUTPUT"

  # The unit tests on the node versions the deploy does not run on. Not a
  # deploy gate: a break that only shows on a newer node should block merging
  # to main (branch protection, to come), not a deploy. The deploy's own node
  # version is tested inside ci-deploy-site.yml, so when nothing deploys (a
  # bot push) this runs every version instead, and no push goes untested.
  test-newer-node:
    needs: resolve
    uses: ./.github/workflows/ci-test.yml
    with:
      node-versions: ${{ needs.resolve.outputs.deploy == 'true' && '[25, 26]' || '[24, 25, 26]' }}

  # The create-qpq-app scaffold check (template rot guard). Runs alongside the
  # deploy so every push gets one workflow run, but it is deliberately NOT a
  # deploy gate: it must never hold up deploying a branch. Its job is to block
  # merging to main (branch protection, to come). Not to be confused with the
  # "deployed smoke" step at the end of ci-deploy-site.yml.
  scaffold:
    uses: ./.github/workflows/ci-scaffold.yml

  # Dependency declarations, lint and the test files' type-check, once per
  # push. Advisory for the same reason as scaffold: a style slip should block
  # merging to main, not a deploy. It runs on every push, bots included, since
  # it is the only place lint runs at all (there are no commit hooks).
  check:
    uses: ./.github/workflows/ci-check.yml

  # The whole deploy: gates, build, deploy and smoke, for the environment the
  # resolve job picked. The permissions block is required here, not just in
  # the called workflow: a reusable workflow can only narrow what its caller
  # grants, and the repository default above is contents-read only.
  deploy:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-deploy-site.yml
    with:
      environment: ${{ needs.resolve.outputs.env }}

name: test

# Pull requests only. Every push already runs this same reusable workflow as a
# gate inside deploy-site, so a push trigger here would duplicate the
# three-version matrix. Pull requests from forks have no push in this repo,
# which is the one case this still covers.
on:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci-test.yml

name: test

# main and develop are deliberately excluded: deploy-site runs the same
# reusable workflow as a gate before it deploys those branches, and running
# here too would duplicate a three-version matrix on every release push.
on:
  push:
    branches-ignore: [main, develop]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci-test.yml
